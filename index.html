<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yacht Dice Scoreboard</title>
  
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-light: #DBEAFE;
      --accent-red: #DC2626;
      --accent-yellow: #F59E0B;
      --accent-green: #059669;
      --bg: #F1F5F9;
      --card-bg: #FFFFFF;
      --border-dark: #1E293B;
      --border: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding-bottom: 40px; 
      overflow-x: hidden;
    }

    header {
      background-color: var(--primary);
      border-bottom: 3px solid var(--border-dark);
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    
    .brand-title {
      display: inline-block;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 800;
      color: #FFFFFF;
      user-select: none;
      transition: transform 0.1s ease;
      letter-spacing: -0.5px;
    }
    .brand-title:active {
      transform: scale(0.97);
    }

    .container { max-width: 600px; margin: 0 auto; padding: 14px 10px; }

    /* 설정 화면 */
    #setup-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2.5px solid var(--border-dark);
      padding: 24px 20px;
      box-shadow: 4px 4px 0px var(--border-dark);
      text-align: center;
      margin-top: 16px;
    }
    .setup-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main); }
    .setup-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; }

    .player-btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .btn-count {
      width: 48px; height: 48px; border-radius: 12px; 
      border: 2px solid var(--border-dark);
      background: #fff; font-size: 1.2rem; font-weight: 800; cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
    }
    .btn-count:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-dark);
    }
    .btn-count.active { 
      background: var(--primary); 
      color: #fff; 
      border-color: var(--border-dark);
      box-shadow: 2px 2px 0px var(--border-dark);
    }

    .player-inputs { margin-bottom: 24px; }
    .player-input-item { margin-bottom: 10px; }
    .player-input-item input {
      width: 100%; max-width: 260px; padding: 10px 14px; 
      border: 2px solid var(--border-dark);
      border-radius: 10px; font-size: 1rem; font-weight: 700; text-align: center; outline: none;
      box-shadow: 2px 2px 0px #E2E8F0;
    }
    .player-input-item input:focus { border-color: var(--primary); }

    .btn-start {
      background: var(--accent-yellow); 
      color: #000; 
      border: 2.5px solid var(--border-dark); 
      border-radius: 12px;
      padding: 12px 40px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-dark);
      transition: all 0.1s ease;
    }
    .btn-start:active { 
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }

    /* 점수판 테이블 */
    #game-container { display: none; position: relative; }
    .table-wrapper {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2.5px solid var(--border-dark);
      overflow-x: auto;
      box-shadow: 4px 4px 0px var(--border-dark);
    }
    table { width: 100%; border-collapse: collapse; min-width: 320px; }
    th, td {
      border: 1.5px solid var(--border-dark);
      padding: 8px 4px;
      text-align: center;
      font-size: 0.85rem;
    }
    th { 
      background: #F8FAFC; 
      color: var(--text-main); 
      font-weight: 800; 
      font-size: 0.95rem;
    }
    .col-category { 
      width: 44%; 
      text-align: left; 
      padding: 6px 8px; 
      font-weight: 700; 
    }
    .cat-main { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .subtext { font-size: 0.68rem; color: var(--text-muted); font-weight: 500; display: block; margin-top: 1px; }

    /* SVG 주사위 스타일 */
    .dice-svg {
      width: 22px;
      height: 22px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .dice-row {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .dice-svg.mini {
      width: 17px;
      height: 17px;
    }
    .dice-spacer {
      display: inline-block;
      width: 5px;
    }
    .dice-party {
      font-size: 0.95rem;
      vertical-align: middle;
      margin-left: 2px;
    }

    .section-header {
      background: #E2E8F0;
      color: #1E293B;
      font-weight: 800;
      text-align: left;
      padding-left: 10px;
      font-size: 0.8rem;
    }

    .cell-score {
      cursor: pointer;
      background: #FFF;
      height: 44px;
      font-weight: 800;
      font-size: 1.05rem;
      user-select: none;
      transition: background-color 0.1s ease;
    }
    .cell-score:active {
      background-color: var(--primary-light);
    }
    .cell-score.empty { color: #CBD5E1; }
    .cell-score.filled { background-color: var(--primary-light); color: var(--primary-dark); }
    .cell-score.zero { color: var(--accent-red); font-weight: 800; }

    .summary-row { background: #F8FAFC; font-weight: 800; }
    .total-row { 
      background: #FEF3C7; 
      font-size: 1.1rem; 
      font-weight: 900; 
      color: #B45309; 
    }

    /* 하단 버튼 2개 */
    .game-actions {
      display: flex; 
      gap: 10px;
      justify-content: space-between; 
      margin-top: 18px;
    }
    .btn-action-home {
      flex: 1;
      background: #FFF; 
      border: 2px solid var(--border-dark); 
      border-radius: 12px;
      padding: 12px 10px; 
      font-size: 0.95rem; 
      font-weight: 800; 
      color: var(--text-main); 
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
    }
    .btn-action-home:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-dark);
    }

    .btn-action-end {
      flex: 1;
      background: #FEE2E2; 
      border: 2px solid var(--accent-red); 
      border-radius: 12px;
      padding: 12px 10px; 
      font-size: 0.95rem; 
      font-weight: 800; 
      color: var(--accent-red); 
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--accent-red);
      transition: all 0.1s ease;
    }
    .btn-action-end:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--accent-red);
      background: #FCA5A5;
    }

    /* 공통 모달 오버레이 */
    .modal-overlay {
      display: none;
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center; 
      justify-content: center; 
      z-index: 99999;
      padding: 16px;
    }

    /* 점수 입력 모달 카드 (반투명 60%) */
    .modal {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px; 
      width: 100%; 
      max-width: 320px;
      padding: 22px 18px; 
      text-align: center; 
      border: 3px solid var(--border-dark);
      box-shadow: 6px 6px 0px var(--border-dark);
    }
    .modal h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
    .modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 600; }

    .btn-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 8px; 
      margin-bottom: 12px; 
    }
    .btn-choice {
      padding: 11px 4px; 
      border: 2px solid var(--border-dark); 
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px; 
      font-weight: 800; 
      font-size: 0.92rem; 
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
    }
    .btn-choice:active { 
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-dark);
      background: var(--primary-light); 
    }

    .modal-number-input {
      width: 100%; padding: 12px; 
      border: 2px solid var(--border-dark);
      border-radius: 10px; font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: 12px; outline: none;
      background: rgba(255, 255, 255, 0.9);
    }
    .modal-btn-confirm {
      width: 100%; background: var(--primary); color: #FFF; 
      border: 2px solid var(--border-dark);
      border-radius: 10px; padding: 12px; font-weight: 800; font-size: 1rem; cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
    }
    .modal-btn-confirm:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-dark);
    }
    
    .modal-btn-zero {
      width: 100%; 
      background: rgba(255, 255, 255, 0.85); 
      border: 2px solid var(--accent-red); 
      color: var(--accent-red);
      border-radius: 10px; 
      padding: 11px; 
      font-weight: 800; 
      font-size: 0.95rem; 
      margin-top: 8px; 
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--accent-red);
      display: block;
    }
    .modal-btn-zero:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--accent-red);
      background: #FEF2F2;
    }

    /* 승자 결과 전용 중앙 팝업 카드 (반투명 60%) */
    .winner-modal-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px; 
      width: 100%; 
      max-width: 330px;
      padding: 26px 20px 22px; 
      text-align: center; 
      border: 3px solid var(--border-dark);
      box-shadow: 6px 6px 0px var(--border-dark);
      animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popUp {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 16px;
    }
    .winner-champion-card {
      background: rgba(254, 243, 199, 0.85);
      border: 2.5px solid var(--accent-yellow);
      border-radius: 14px;
      padding: 14px 10px;
      margin-bottom: 14px;
      box-shadow: 2px 2px 0px var(--border-dark);
    }
    .winner-champion-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #92400E;
    }
    .winner-champion-score {
      font-size: 1.05rem;
      font-weight: 800;
      color: #B45309;
      margin-top: 2px;
    }
    .winner-ranks-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    .winner-rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .winner-home-btn {
      width: 100%;
      background: var(--primary);
      color: #FFF;
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
    }
    .winner-home-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-dark);
    }

    /* 팝업 위 레이어 포물선 폭죽 (z-index: 100000) */
    .confetti-container {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100000;
      overflow: hidden;
    }
    .confetti-item {
      position: absolute;
      bottom: -40px;
      font-size: 2.2rem;
      user-select: none;
      animation: shootArc 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes shootArc {
      0% {
        transform: translateY(0) scale(0.6) rotate(0deg);
        opacity: 1;
      }
      60% {
        transform: translateY(var(--target-y)) scale(1.2) rotate(var(--target-rot));
        opacity: 1;
      }
      100% {
        transform: translateY(calc(var(--target-y) + 70px)) scale(0.95) rotate(calc(var(--target-rot) * 1.5));
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand-title" onclick="goHome()">🎲 YACHT DICE 점수판</h1>
  </header>

  <div class="container">
    <div id="setup-card">
      <h2 class="setup-title">울려라 울려라 야추를 울려~ 🔔</h2>
      <p class="setup-desc">닉네임을 입력하세요 😎</p>
      
      <div class="player-btn-group">
        <button type="button" class="btn-count" onclick="setPlayerCount(1)">1</button>
        <button type="button" class="btn-count active" onclick="setPlayerCount(2)">2</button>
        <button type="button" class="btn-count" onclick="setPlayerCount(3)">3</button>
        <button type="button" class="btn-count" onclick="setPlayerCount(4)">4</button>
      </div>

      <div class="player-inputs" id="player-inputs-container"></div>

      <button type="button" class="btn-start" onclick="startGame()">Game on 🔥</button>
    </div>

    <div id="game-container">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr id="header-row">
              <th class="col-category">카테고리</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
      </div>

      <div class="game-actions">
        <button type="button" class="btn-action-home" onclick="goHome()">홈으로 돌아가기 🏠</button>
        <button type="button" class="btn-action-end" onclick="finishGameEarly()">여기서 게임 종료 🏁</button>
      </div>
    </div>
  </div>

  <!-- 점수 입력 모달 -->
  <div id="input-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modal-title">카테고리</h3>
      <p id="modal-desc">점수를 입력해주세요</p>

      <div id="modal-preset-container" class="btn-grid"></div>
      
      <div id="modal-custom-container" style="display:none;">
        <input type="number" id="custom-score-input" class="modal-number-input" min="0" max="30" placeholder="점수 입력">
        <button type="button" class="modal-btn-confirm" onclick="applyCustomScore()">점수 입력 완료!</button>
      </div>

      <button type="button" class="modal-btn-zero" onclick="applyScore(0)">0점 처리 (포기) 😭</button>
    </div>
  </div>

  <!-- 점수판 위에 정중앙으로 뜨는 승자 안내 반투명 모달 팝업 -->
  <div id="winner-modal" class="modal-overlay">
    <div class="winner-modal-card" onclick="event.stopPropagation()">
      <div class="winner-title">🎲 Winner! 🏆</div>
      
      <div class="winner-champion-card">
        <div class="winner-champion-name" id="winner-name">Player Name</div>
        <div class="winner-champion-score" id="winner-score">0점</div>
      </div>

      <div class="winner-ranks-list" id="winner-ranks-list"></div>

      <button type="button" class="winner-home-btn" onclick="closeWinnerAndGoHome()">홈으로 돌아가기</button>
    </div>
  </div>

  <!-- 팝업 위 레이어 폭죽 컨테이너 -->
  <div id="confetti-container" class="confetti-container"></div>

  <script>
    function getDiceSvg(val, isMini = false) {
      const cls = isMini ? 'dice-svg mini' : 'dice-svg';
      let dots = '';
      if (val === 1) {
        dots = '<circle cx="50" cy="50" r="15" fill="#DC2626"/>';
      } else if (val === 2) {
        dots = '<circle cx="28" cy="28" r="9" fill="#1E293B"/><circle cx="72" cy="72" r="9" fill="#1E293B"/>';
      } else if (val === 3) {
        dots = '<circle cx="26" cy="26" r="9" fill="#1E293B"/><circle cx="50" cy="50" r="9" fill="#1E293B"/><circle cx="74" cy="74" r="9" fill="#1E293B"/>';
      } else if (val === 4) {
        dots = '<circle cx="28" cy="28" r="9" fill="#1E293B"/><circle cx="72" cy="28" r="9" fill="#1E293B"/><circle cx="28" cy="72" r="9" fill="#1E293B"/><circle cx="72" cy="72" r="9" fill="#1E293B"/>';
      } else if (val === 5) {
        dots = '<circle cx="26" cy="26" r="9" fill="#1E293B"/><circle cx="74" cy="26" r="9" fill="#1E293B"/><circle cx="50" cy="50" r="9" fill="#1E293B"/><circle cx="26" cy="74" r="9" fill="#1E293B"/><circle cx="74" cy="74" r="9" fill="#1E293B"/>';
      } else if (val === 6) {
        dots = '<circle cx="28" cy="25" r="8.5" fill="#1E293B"/><circle cx="28" cy="50" r="8.5" fill="#1E293B"/><circle cx="28" cy="75" r="8.5" fill="#1E293B"/><circle cx="72" cy="25" r="8.5" fill="#1E293B"/><circle cx="72" cy="50" r="8.5" fill="#1E293B"/><circle cx="72" cy="75" r="8.5" fill="#1E293B"/>';
      }
      return `<svg class="${cls}" viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="8"/>${dots}</svg>`;
    }

    const ALL_CATEGORIES = {
      aces: { id: 'aces', name: 'Aces', diceVal: 1, sub: '1의 눈 합', base: 1, isUpper: true },
      deuces: { id: 'deuces', name: 'Deuces', diceVal: 2, sub: '2의 눈 합', base: 2, isUpper: true },
      threes: { id: 'threes', name: 'Threes', diceVal: 3, sub: '3의 눈 합', base: 3, isUpper: true },
      fours: { id: 'fours', name: 'Fours', diceVal: 4, sub: '4의 눈 합', base: 4, isUpper: true },
      fives: { id: 'fives', name: 'Fives', diceVal: 5, sub: '5의 눈 합', base: 5, isUpper: true },
      sixes: { id: 'sixes', name: 'Sixes', diceVal: 6, sub: '6의 눈 합', base: 6, isUpper: true },
      choice: { id: 'choice', name: 'Choice', type: 'custom', isUpper: false },
      four_kind: { id: 'four_kind', name: '4 of a Kind', type: 'custom', isUpper: false },
      full_house: { id: 'full_house', name: 'Full House', type: 'fixed', score: 25, isUpper: false },
      s_straight: { id: 's_straight', name: 'S. Straight', type: 'fixed', score: 30, isUpper: false },
      l_straight: { id: 'l_straight', name: 'L. Straight', type: 'fixed', score: 40, isUpper: false },
      yacht: { id: 'yacht', name: 'Yacht', type: 'fixed', score: 50, isUpper: false }
    };

    const UPPER_KEYS = ['aces', 'deuces', 'threes', 'fours', 'fives', 'sixes'];
    const LOWER_KEYS = ['choice', 'four_kind', 'full_house', 's_straight', 'l_straight', 'yacht'];

    const dMini = (n) => getDiceSvg(n, true);

    const LOWER_ICONS = {
      choice: `${dMini(1)}${dMini(2)}${dMini(3)}${dMini(4)}${dMini(5)}`,
      four_kind: `${dMini(5)}${dMini(5)}${dMini(5)}${dMini(5)}`,
      full_house: `${dMini(3)}${dMini(3)}${dMini(3)}<span class="dice-spacer"></span>${dMini(6)}${dMini(6)} (25점)`,
      s_straight: `${dMini(1)}${dMini(2)}${dMini(3)}${dMini(4)} (30점)`,
      l_straight: `${dMini(1)}${dMini(2)}${dMini(3)}${dMini(4)}${dMini(5)} (40점)`,
      yacht: `${dMini(6)}${dMini(6)}${dMini(6)}${dMini(6)}${dMini(6)} <span class="dice-party">🎉</span> (50점)`
    };

    let playerCount = 2;
    let players = [];
    let scores = {};
    let activeCell = null;

    function setPlayerCount(count) {
      playerCount = count;
      document.querySelectorAll('.btn-count').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === count);
      });
      renderNameInputs();
    }

    function renderNameInputs() {
      const container = document.getElementById('player-inputs-container');
      container.innerHTML = '';
      for (let i = 0; i < playerCount; i++) {
        const div = document.createElement('div');
        div.className = 'player-input-item';
        div.innerHTML = `<input type="text" id="p-name-${i}" value="플레이어 ${i + 1}" maxlength="6">`;
        container.appendChild(div);
      }
    }

    function startGame() {
      players = [];
      scores = {};
      for (let i = 0; i < playerCount; i++) {
        const name = document.getElementById(`p-name-${i}`).value.trim() || `P${i + 1}`;
        players.push(name);
        scores[i] = {};
      }

      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      buildTable();
    }

    function buildTable() {
      const headerRow = document.getElementById('header-row');
      headerRow.innerHTML = '<th class="col-category">카테고리</th>';
      players.forEach(name => {
        const th = document.createElement('th');
        th.textContent = name;
        headerRow.appendChild(th);
      });

      const tbody = document.getElementById('score-body');
      tbody.innerHTML = '';

      tbody.innerHTML += `<tr><td colspan="${playerCount + 1}" class="section-header">상단 (Upper Section)</td></tr>`;
      UPPER_KEYS.forEach(key => {
        const cat = ALL_CATEGORIES[key];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-category">
            <div class="cat-main">
              ${getDiceSvg(cat.diceVal)}
              <span>${cat.name}</span>
            </div>
            <span class="subtext">${cat.sub}</span>
          </td>
          ${generateScoreCells(key)}
        `;
        tbody.appendChild(tr);
      });

      tbody.appendChild(createSummaryRow('upper_subtotal', '상단 합계', '63점 이상 보너스'));
      tbody.appendChild(createSummaryRow('bonus', '보너스 (+35) 🎁', '63점 달성 시'));

      tbody.innerHTML += `<tr><td colspan="${playerCount + 1}" class="section-header">하단 (Lower Section)</td></tr>`;
      LOWER_KEYS.forEach(key => {
        const cat = ALL_CATEGORIES[key];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-category">
            <div class="cat-main"><span>${cat.name}</span></div>
            <div class="dice-row">${LOWER_ICONS[key]}</div>
          </td>
          ${generateScoreCells(key)}
        `;
        tbody.appendChild(tr);
      });

      tbody.appendChild(createTotalRow());

      tbody.onclick = function(e) {
        const cell = e.target.closest('.cell-score');
        if (!cell) return;
        const pIndex = parseInt(cell.dataset.pindex, 10);
        const catId = cell.dataset.catid;
        openModalDirect(pIndex, catId);
      };
    }

    function generateScoreCells(catId) {
      let html = '';
      for (let i = 0; i < playerCount; i++) {
        html += `<td class="cell-score empty" id="cell-${i}-${catId}" data-pindex="${i}" data-catid="${catId}">-</td>`;
      }
      return html;
    }

    function createSummaryRow(id, title, sub) {
      const tr = document.createElement('tr');
      tr.className = 'summary-row';
      tr.innerHTML = `<td class="col-category"><div>${title}</div><span class="subtext">${sub}</span></td>`;
      for (let i = 0; i < playerCount; i++) {
        tr.innerHTML += `<td id="cell-calc-${id}-${i}">0</td>`;
      }
      return tr;
    }

    function createTotalRow() {
      const tr = document.createElement('tr');
      tr.className = 'total-row';
      tr.innerHTML = `<td class="col-category"><strong>총점 (Total) 🏆</strong></td>`;
      for (let i = 0; i < playerCount; i++) {
        tr.innerHTML += `<td id="cell-calc-total-${i}">0</td>`;
      }
      return tr;
    }

    function openModalDirect(pIndex, catId) {
      const cat = ALL_CATEGORIES[catId];
      if (!cat) return;
      activeCell = { pIndex, catId };

      document.getElementById('modal-title').textContent = `${players[pIndex]} - ${cat.name}`;
      document.getElementById('modal-desc').textContent = '점수를 입력해주세요';

      const presetContainer = document.getElementById('modal-preset-container');
      const customContainer = document.getElementById('modal-custom-container');
      presetContainer.innerHTML = '';

      if (cat.base) {
        presetContainer.style.display = 'grid';
        presetContainer.style.gridTemplateColumns = 'repeat(3, 1fr)';
        customContainer.style.display = 'none';
        for (let count = 1; count <= 5; count++) {
          const val = count * cat.base;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-choice';
          btn.textContent = `${val}점 (${count}개)`;
          btn.onclick = () => applyScore(val);
          presetContainer.appendChild(btn);
        }
      } else if (cat.type === 'fixed') {
        presetContainer.style.display = 'grid';
        presetContainer.style.gridTemplateColumns = '1fr';
        customContainer.style.display = 'none';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-choice';
        btn.style.color = 'var(--primary)';
        btn.textContent = `달성 (+${cat.score}점) ✨`;
        btn.onclick = () => applyScore(cat.score);
        presetContainer.appendChild(btn);
      } else {
        presetContainer.style.display = 'none';
        customContainer.style.display = 'block';
        const input = document.getElementById('custom-score-input');
        input.value = '';
        setTimeout(() => input.focus(), 120);
      }

      document.getElementById('input-modal').style.display = 'flex';
    }

    function closeModal(e) {
      document.getElementById('input-modal').style.display = 'none';
    }

    function applyCustomScore() {
      const input = document.getElementById('custom-score-input');
      const val = parseInt(input.value, 10);
      if (isNaN(val) || val < 0 || val > 30) {
        alert('0~30 점 사이만 입력 가능합니다 ;)');
        return;
      }
      applyScore(val);
    }

    function applyScore(val) {
      if (!activeCell) return;
      const { pIndex, catId } = activeCell;
      scores[pIndex][catId] = val;

      const cell = document.getElementById(`cell-${pIndex}-${catId}`);
      if (cell) {
        cell.textContent = val;
        cell.classList.remove('empty', 'zero');
        cell.classList.add('filled');
        if (val === 0) cell.classList.add('zero');
      }

      recalculate();
      closeModal();
    }

    function recalculate() {
      let allFinished = true;

      for (let i = 0; i < playerCount; i++) {
        let upperSum = 0;
        let upperFilled = 0;
        UPPER_KEYS.forEach(key => {
          const s = scores[i][key];
          if (s !== undefined && s !== null) {
            upperSum += s;
            upperFilled++;
          }
        });
        document.getElementById(`cell-calc-upper_subtotal-${i}`).textContent = `${upperSum} / 63`;

        const bonus = upperSum >= 63 ? 35 : 0;
        const bonusCell = document.getElementById(`cell-calc-bonus-${i}`);
        bonusCell.textContent = bonus;
        bonusCell.style.color = bonus > 0 ? 'var(--accent-green)' : 'inherit';

        let lowerSum = 0;
        let lowerFilled = 0;
        LOWER_KEYS.forEach(key => {
          const s = scores[i][key];
          if (s !== undefined && s !== null) {
            lowerSum += s;
            lowerFilled++;
          }
        });

        const total = upperSum + bonus + lowerSum;
        document.getElementById(`cell-calc-total-${i}`).textContent = total;

        if ((upperFilled + lowerFilled) < 12) {
          allFinished = false;
        }
      }

      if (allFinished) {
        showWinnerModal();
      }
    }

    /* 포물선형 5구역 분산 폭죽 */
    function triggerConfetti() {
      const container = document.getElementById('confetti-container');
      container.innerHTML = '';
      const emojis = ['🎉', '👑', '✨'];
      
      const zoneMultipliers = [0.70, 0.85, 1.00, 0.90, 0.75];
      const baseMaxHeight = 72;

      for (let i = 0; i < 42; i++) {
        const span = document.createElement('span');
        span.className = 'confetti-item';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        const zone = Math.floor(Math.random() * 5);
        const zoneStart = zone * 20;
        const startX = zoneStart + Math.random() * 18 + 1;
        span.style.left = `${startX}vw`;

        const multiplier = zoneMultipliers[zone];
        const targetHeightVh = (baseMaxHeight * multiplier) + (Math.random() * 6 - 3);
        span.style.setProperty('--target-y', `-${targetHeightVh}vh`);

        const randRot = (Math.random() * 360 - 180) + 'deg';
        span.style.setProperty('--target-rot', randRot);

        span.style.animationDelay = `${Math.random() * 0.75}s`;
        container.appendChild(span);
      }

      setTimeout(() => { container.innerHTML = ''; }, 4200);
    }

    /* 승자 모달 표시 함수 (화면 정중앙 반투명 팝업) */
    function showWinnerModal() {
      const ranking = [];
      for (let i = 0; i < playerCount; i++) {
        const total = parseInt(document.getElementById(`cell-calc-total-${i}`).textContent, 10);
        ranking.push({ name: players[i], score: total });
      }
      ranking.sort((a, b) => b.score - a.score);

      const winner = ranking[0];
      document.getElementById('winner-name').textContent = winner.name;
      document.getElementById('winner-score').textContent = `${winner.score}점`;

      const ranksContainer = document.getElementById('winner-ranks-list');
      ranksContainer.innerHTML = '';

      for (let r = 1; r < ranking.length; r++) {
        if (r > 2) break;
        const rankLabel = r === 1 ? '🥈 2등' : '🥉 3등';
        const item = document.createElement('div');
        item.className = 'winner-rank-item';
        item.innerHTML = `
          <span>${rankLabel}: ${ranking[r].name}</span>
          <span>${ranking[r].score}점</span>
        `;
        ranksContainer.appendChild(item);
      }

      // 모달 열기
      document.getElementById('winner-modal').style.display = 'flex';
      triggerConfetti();
    }

    function closeWinnerAndGoHome() {
      document.getElementById('winner-modal').style.display = 'none';
      document.getElementById('confetti-container').innerHTML = '';
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('setup-card').style.display = 'block';
    }

    function finishGameEarly() {
      if (!confirm('현재 점수 기준으로 게임을 종료하고 승자를 정할까요?')) return;
      showWinnerModal();
    }

    function goHome() {
      const isGameActive = document.getElementById('game-container').style.display === 'block';
      if (isGameActive) {
        const confirmed = confirm('점수가 초기화 됩니다 T.T');
        if (!confirmed) return;
      }

      document.getElementById('winner-modal').style.display = 'none';
      document.getElementById('confetti-container').innerHTML = '';
      document.getElementById('game-container').style.display = 'none';
      document.getElementById('setup-card').style.display = 'block';
    }

    renderNameInputs();
  </script>
</body>
</html>
